name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pipeline-import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install pipeline deps (no playwright browsers)
        run: |
          python -m pip install --upgrade pip
          pip install -r pipeline/requirements.txt

      - name: Verify pipeline imports & public URL helper
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python - <<'PY'
          from pipeline.enrichment.job_resolver import _to_public_url, JobResolver, CAREER_URL_PATHS
          assert _to_public_url("greenhouse", "algolia") == "https://boards.greenhouse.io/algolia"
          assert _to_public_url("ashby", "9-mothers") == "https://jobs.ashbyhq.com/9-mothers"
          assert CAREER_URL_PATHS
          from pipeline.enrichment.photo_url import normalize_photo_url
          signed = "https://bookface-images.s3.us-west-2.amazonaws.com/avatars/x.jpg?X-Amz-Expires=3600"
          assert normalize_photo_url(signed) == "https://bookface-images.s3.us-west-2.amazonaws.com/avatars/x.jpg"
          from pipeline.scrapers.yc.algolia_client import build_filter_string, parse_algolia_opts
          assert build_filter_string(None) == 'status:"Active"'
          assert build_filter_string({"isHiring": True, "batch": 'A "b"'}) == 'isHiring:true AND batch:"A \\"b\\""'
          creds = parse_algolia_opts('window.AlgoliaOpts = {"app":"APP","key":"abc","valid_until":1};')
          assert (creds.app_id, creds.api_key) == ("APP", "abc")
          import json, tempfile
          from pipeline.storage.db import Database
          from pipeline.storage.export import export_to_json
          from pipeline.storage.models import Company
          with tempfile.TemporaryDirectory() as tmp:
              db = Database(f"{tmp}/t.db")
              db.connect()
              db.upsert_company(Company(yc_id=1, name="Still Hiring", slug="still", is_hiring=True))
              db.upsert_company(Company(yc_id=2, name="Stopped Hiring", slug="stopped", is_hiring=True))
              db.upsert_company(Company(name="Other", slug="stopped", is_hiring=True, source_vc="Antler"))
              assert db.delete_companies_not_in("Y Combinator", {"still"}) == 1
              export_to_json(db, f"{tmp}/out.json")
              db.close()
              exported = json.load(open(f"{tmp}/out.json"))["companies"]
              assert sorted((c["source_vc"], c["slug"]) for c in exported) == [("Antler", "stopped"), ("Y Combinator", "still")]
          print("pipeline checks OK")
          PY

  dashboard-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck / build
        run: npm run build
