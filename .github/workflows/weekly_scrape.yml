# Weekly / manual startup data refresh.
#
# CI notes:
# - Ollama is not available on GitHub runners → --no-llm
# - Playwright founder scrape is slow/flaky → --no-founders
# - Push strategy: re-base working tree onto latest origin/main BEFORE commit
#   so non-fast-forward rejections never happen (main moves during long scrapes).

name: Weekly Startup Data Refresh

on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-scrape-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true
          # Always start from the tip of the branch being built
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pipeline/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r pipeline/requirements.txt

      - name: Run pipeline
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m pipeline --source yc --hiring-only --no-llm --no-founders

      - name: Copy data to dashboard
        run: |
          set -euo pipefail
          test -f data/companies.json
          cp data/companies.json dashboard/public/companies.json
          python - <<'PY'
          import json, pathlib, sys
          p = pathlib.Path("dashboard/public/companies.json")
          data = json.loads(p.read_text())
          companies = data.get("companies") if isinstance(data, dict) else data
          if not companies:
              print("ERROR: companies.json has zero companies", file=sys.stderr)
              sys.exit(1)
          print(f"OK: {len(companies)} companies, {p.stat().st_size} bytes")
          PY

      # Keep refreshed JSON outside the git worktree so we can hard-reset to latest main
      - name: Snapshot refreshed data files
        run: |
          set -euo pipefail
          mkdir -p /tmp/job-hunt-data
          cp data/companies.json /tmp/job-hunt-data/companies.json
          cp dashboard/public/companies.json /tmp/job-hunt-data/public-companies.json
          ls -la /tmp/job-hunt-data

      - name: Commit and push onto latest main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          BRANCH="${{ github.ref_name }}"
          REPO="${{ github.repository }}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"

          # Critical: sync to remote tip AFTER scrape so push is always fast-forward
          git fetch origin "${BRANCH}"
          git checkout -B "${BRANCH}" "origin/${BRANCH}"

          # Restore the fresh scrape on top of latest main
          mkdir -p data dashboard/public
          cp /tmp/job-hunt-data/companies.json data/companies.json
          cp /tmp/job-hunt-data/public-companies.json dashboard/public/companies.json

          git add data/companies.json dashboard/public/companies.json

          if git diff --staged --quiet; then
            echo "No data changes vs origin/${BRANCH} — nothing to commit."
            exit 0
          fi

          git commit -m "chore: weekly data refresh $(date -u '+%Y-%m-%d')"

          # Retry push a few times in case something else lands mid-push
          for attempt in 1 2 3; do
            echo "Push attempt ${attempt}..."
            if git push origin "HEAD:${BRANCH}"; then
              echo "Push succeeded."
              exit 0
            fi
            echo "Push rejected; re-syncing onto latest ${BRANCH}..."
            git fetch origin "${BRANCH}"
            # Rebuild commit on newest tip with same data files
            git reset --hard "origin/${BRANCH}"
            cp /tmp/job-hunt-data/companies.json data/companies.json
            cp /tmp/job-hunt-data/public-companies.json dashboard/public/companies.json
            git add data/companies.json dashboard/public/companies.json
            if git diff --staged --quiet; then
              echo "Remote already has identical data."
              exit 0
            fi
            git commit -m "chore: weekly data refresh $(date -u '+%Y-%m-%d')"
            sleep $((attempt * 2))
          done

          echo "ERROR: failed to push after 3 attempts" >&2
          exit 1
