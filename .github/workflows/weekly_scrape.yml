# WHY --no-llm in CI:
# Ollama (local AI) cannot run on GitHub's free servers.
# College extraction via LLM is skipped in CI runs.
# To get LLM-enriched data, run locally:
#   python3 -m pipeline --source yc --hiring-only
# The pipeline degrades gracefully — college field = null in CI runs,
# all other fields (jobs, founders, company data) work fully.

name: Weekly Startup Data Refresh

on:
  schedule:
    - cron: '0 9 * * 1'  # Every Monday at 9am UTC
  workflow_dispatch:       # Also allows manual trigger from GitHub UI

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 60    # Kill if takes longer than 1 hour (something broke)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pipeline/requirements.txt') }}

      - name: Install Python dependencies
        run: |
          cd pipeline
          pip install -r requirements.txt

      - name: Install Playwright browsers
        run: |
          cd pipeline
          python -m playwright install chromium --with-deps

      - name: Set up pipeline path
        run: echo "PYTHONPATH=$GITHUB_WORKSPACE" >> $GITHUB_ENV

      - name: Run pipeline
        run: python3 -m pipeline --source yc --hiring-only --no-llm --no-founders

      - name: Copy data to dashboard
        run: cp data/companies.json dashboard/public/companies.json

      - name: Commit and push fresh data
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/companies.json dashboard/public/companies.json
          git diff --staged --quiet || git commit -m "chore: weekly data refresh $(date -u '+%Y-%m-%d')"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
